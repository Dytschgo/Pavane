name: Desktop checks

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:verification
      - run: node --check scripts/performance-smoke.mjs
      - run: node --check scripts/native-smoke.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build source-bound lab input
        run: node scripts/prepare-prebuilt.mjs
        env:
          PAVANE_REQUESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: pavane-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            verification-input/pavane.exe
            verification-input/manifest.json
          if-no-files-found: error
          retention-days: 7
